name: DepthStudio
options:
  bundleIdPrefix: com.bananaflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FIT:
    url: https://github.com/garmin/fit-objective-c-sdk.git
    revision: c952434903a440ff44649ffa7f8c967a692f4b19
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Depth Studio"
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Depth Studio 會將輸出的潛水影片儲存到你的照片圖庫。"
    CODE_SIGNING_ALLOWED: NO
targets:
  DepthStudio:
    type: application
    platform: iOS
    sources:
      - path: Assets.xcassets
      - path: LaunchScreen.storyboard
      - path: AtmosUDDFParser.swift
      - path: ContentView.swift
      - path: ModeSelectionView.swift
      - path: PoolModeView.swift
      - path: PoolTimeline.swift
      - path: PoolHUDSettings.swift
      - path: PoolHUDOverlay.swift
      - path: PoolVideoHUDLayer.swift
      - path: PoolMotionAnalyzer.swift
      - path: StudioShared.swift
      - path: HUDLayerFactory.swift
      - path: HUDStyle.swift
      - path: HUDVideoCompositor.swift
      - path: UITestSupport.swift
      - path: DepthStudioApp.swift
      - path: HUDSettings.swift
      - path: DiveDataInterpolator.swift
      - path: GarminFITParser.swift
      - path: DiveHUDOverlay.swift
      - path: DepthGauge.swift
      - path: DiveVideoExporter.swift
      - path: DiveVideoPreview.swift
      - path: TimelineSync.swift
    dependencies:
      - package: FIT
        product: FIT
    scheme:
      testTargets:
        - DepthStudioTests
        - DepthStudioUITests
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_MODULE_NAME: DepthStudio
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "4"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        PRODUCT_BUNDLE_IDENTIFIER: com.bananaflow.depthstudio
        PRODUCT_NAME: "Depth Studio"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_EMIT_LOC_STRINGS: YES

  # Unit and integration tests (pool timeline, export sizes, layout defaults, a real
  # 4K export of a generated video compared with the preview). Run by scripts/ci_test.sh.
  DepthStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: DepthStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bananaflow.depthstudio.tests
        # The app's product name has a space, so the default TEST_HOST (target name) is wrong.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Depth Studio.app/Depth Studio"
        BUNDLE_LOADER: "$(TEST_HOST)"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"

  # UI tests: drag every HUD field, layout toggle, set/restore default layout.
  DepthStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: DepthStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bananaflow.depthstudio.uitests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
