workflows:
  depth-studio-unsigned-ios:
    name: Depth Studio · V8.18 Native Parity + Fullscreen Launch + AltStore IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -d DepthStudio.xcodeproj
      - name: Resolve Swift packages
        script: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project DepthStudio.xcodeproj \
            -scheme DepthStudio
      - name: Build unsigned iOS Release app
        script: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project DepthStudio.xcodeproj \
            -scheme DepthStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild-release.log
      - name: Validate app bundle and create AltStore-compatible IPA
        script: |
          set -euo pipefail

          APP_DIR="build/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          APP_VERSION="1.0.3"
          APP_BUILD_VERSION="4"

          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "ERROR: No .app bundle found in $APP_DIR"
            exit 1
          fi

          PLIST="$APP_PATH/Info.plist"
          [[ -f "$PLIST" ]] || { echo "ERROR: Info.plist missing"; exit 1; }
          /usr/bin/plutil -lint "$PLIST"

          # Guarantee installer metadata even if XcodeGen changes generated keys.
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" "$PLIST"
          fi
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_BUILD_VERSION" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $APP_BUILD_VERSION" "$PLIST"
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          LAUNCH_STORYBOARD=$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$PLIST")
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")

          [[ "$BUNDLE_ID" == "com.bananaflow.depthstudio" ]] || { echo "ERROR: Unexpected Bundle ID: $BUNDLE_ID"; exit 1; }
          [[ "$SHORT_VERSION" == "$APP_VERSION" ]] || { echo "ERROR: Unexpected app version: $SHORT_VERSION"; exit 1; }
          [[ "$BUILD_VERSION" == "$APP_BUILD_VERSION" ]] || { echo "ERROR: Unexpected build version: $BUILD_VERSION"; exit 1; }
          [[ "$LAUNCH_STORYBOARD" == "LaunchScreen" ]] || { echo "ERROR: Launch storyboard is not configured"; exit 1; }
          [[ -d "$APP_PATH/Base.lproj/LaunchScreen.storyboardc" ]] || { echo "ERROR: Full-screen LaunchScreen storyboard was not compiled into the app"; exit 1; }
          [[ -s "$APP_PATH/$EXECUTABLE" ]] || { echo "ERROR: App executable missing or empty"; exit 1; }
          [[ -s "$APP_PATH/Assets.car" ]] || { echo "ERROR: Assets.car missing or empty"; exit 1; }
          [[ -d "$APP_PATH/FIT_cppfit.bundle" ]] || { echo "ERROR: FIT_cppfit.bundle missing"; exit 1; }

          ARCHS="$(xcrun lipo -archs "$APP_PATH/$EXECUTABLE")"
          echo "App executable architectures: $ARCHS"
          [[ " $ARCHS " == *" arm64 "* ]] || { echo "ERROR: iPhone arm64 architecture missing"; exit 1; }

          echo "Validated Bundle ID: $BUNDLE_ID"
          echo "Validated app version: $SHORT_VERSION ($BUILD_VERSION)"
          echo "Validated executable: $EXECUTABLE"
          echo "Validated launch storyboard: $LAUNCH_STORYBOARD"

          python3 scripts/package_ipa.py \
            --app "$APP_PATH" \
            --output "build/DepthStudio.ipa"

          [[ -s build/DepthStudio.ipa ]] || { echo "ERROR: IPA output missing"; exit 1; }
          echo "SUCCESS: build/DepthStudio.ipa passed bundle, ARM64 and archive validation."
    artifacts:
      - build/DepthStudio.ipa
      - build/xcodebuild-release.log
