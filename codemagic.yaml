workflows:
  depth-studio-unsigned-ios:
    name: Depth Studio · unsigned iOS Release + IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -d DepthStudio.xcodeproj
      - name: Resolve Swift packages
        script: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project DepthStudio.xcodeproj \
            -scheme DepthStudio
      - name: Build unsigned iOS Release app
        script: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project DepthStudio.xcodeproj \
            -scheme DepthStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild-release.log
      - name: Validate app bundle and package IPA
        script: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Depth Studio.app"
          PLIST="$APP_PATH/Info.plist"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "ERROR: Expected app bundle not found: $APP_PATH"
            exit 1
          fi
          if [[ ! -f "$PLIST" ]]; then
            echo "ERROR: Info.plist missing from app bundle"
            exit 1
          fi
          /usr/bin/plutil -lint "$PLIST"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")

          [[ "$BUNDLE_ID" == "com.bananaflow.depthstudio" ]] || { echo "ERROR: Unexpected Bundle ID: $BUNDLE_ID"; exit 1; }
          [[ -n "$SHORT_VERSION" ]] || { echo "ERROR: CFBundleShortVersionString is empty"; exit 1; }
          [[ -n "$BUILD_VERSION" ]] || { echo "ERROR: CFBundleVersion is empty"; exit 1; }
          [[ -s "$APP_PATH/$EXECUTABLE" ]] || { echo "ERROR: App executable missing or empty"; exit 1; }
          [[ -s "$APP_PATH/Assets.car" ]] || { echo "ERROR: Assets.car missing or empty"; exit 1; }
          [[ -d "$APP_PATH/FIT_cppfit.bundle" ]] || { echo "ERROR: FIT_cppfit.bundle missing"; exit 1; }

          echo "Validated Bundle ID: $BUNDLE_ID"
          echo "Validated app version: $SHORT_VERSION ($BUILD_VERSION)"
          echo "Validated executable: $EXECUTABLE"

          REPO_ROOT="$PWD"
          IPA_WORK="$REPO_ROOT/build/ipa-work"
          IPA_PATH="$REPO_ROOT/build/DepthStudio.ipa"
          rm -rf "$IPA_WORK" "$IPA_PATH"
          mkdir -p "$IPA_WORK/Payload"
          APP_NAME="$(basename "$APP_PATH")"
          ditto "$APP_PATH" "$IPA_WORK/Payload/$APP_NAME"

          # Use Apple's ditto archiver to create a standard IPA ZIP with Payload at root.
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$IPA_WORK/Payload" "$IPA_PATH"

          [[ -s "$IPA_PATH" ]] || { echo "ERROR: IPA file was not created"; exit 1; }
          /usr/bin/unzip -t "$IPA_PATH"

          IPA_CHECK="$REPO_ROOT/build/ipa-check"
          rm -rf "$IPA_CHECK"
          mkdir -p "$IPA_CHECK"
          /usr/bin/unzip -q "$IPA_PATH" -d "$IPA_CHECK"
          CHECK_APP="$IPA_CHECK/Payload/Depth Studio.app"
          CHECK_PLIST="$CHECK_APP/Info.plist"
          [[ -f "$CHECK_PLIST" ]] || { echo "ERROR: IPA is missing Payload/Depth Studio.app/Info.plist"; exit 1; }
          [[ -s "$CHECK_APP/$EXECUTABLE" ]] || { echo "ERROR: IPA is missing app executable"; exit 1; }
          [[ -s "$CHECK_APP/Assets.car" ]] || { echo "ERROR: IPA is missing Assets.car"; exit 1; }
          CHECK_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$CHECK_PLIST")
          CHECK_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$CHECK_PLIST")
          [[ "$CHECK_VERSION" == "$SHORT_VERSION" && "$CHECK_BUILD" == "$BUILD_VERSION" ]] || { echo "ERROR: Version metadata did not survive IPA packaging"; exit 1; }
          rm -rf "$IPA_CHECK" "$IPA_WORK"
          echo "SUCCESS: build/DepthStudio.ipa is a validated, unsigned Release IPA."
    artifacts:
      - build/DepthStudio.ipa
      - build/xcodebuild-release.log
      - build/DerivedData/Build/Products/Release-iphoneos/*.app
