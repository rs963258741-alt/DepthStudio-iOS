# Codemagic (optional) — builds the same unsigned IPA as GitHub Actions.
#
# The main pipeline is .github/workflows/ios-build.yml, which also publishes the
# GitHub Release that AltStore installs from. This workflow is kept so the app
# can still be built on Codemagic by starting it by hand in the Codemagic UI
# (e.g. when GitHub's macOS runners are unavailable).
# Both use scripts/ci_build.sh, so a fix there applies to both.
# Build numbers are Codemagic's BUILD_NUMBER + 1000, so they never collide with
# GitHub's (run number + 100) and always increase for AltStore.
workflows:
  depth-studio-unsigned-ios:
    name: Depth Studio · unsigned IPA for AltStore
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Tests
        script: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and package IPA
        script: |
          set -euo pipefail
          export APP_BUILD_NUMBER=$(( ${BUILD_NUMBER:-0} + 1000 ))
          bash scripts/ci_build.sh
    artifacts:
      - build/DepthStudio.ipa
      - build/xcodebuild-release.log

  # Unit, export and UI tests on an iPhone simulator (started by Claude through the
  # Codemagic API). Saves preview-vs-export images for review.
  depth-studio-tests:
    name: Depth Studio · simulator tests
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Python checks
        script: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Simulator tests (unit, export, UI)
        script: |
          set -euo pipefail
          bash scripts/ci_test.sh
    artifacts:
      - build/test-artifacts/*.png
      - build/test-summary.txt
      - build/xcodebuild-test.log
