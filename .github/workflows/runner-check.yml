# Temporary: find which GitHub macOS runner labels currently pick up jobs.
name: Runner availability check
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/runner-check.yml"]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: sw_vers && xcodebuild -version && ls /Applications | grep -i xcode
